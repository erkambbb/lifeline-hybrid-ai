<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Lifeline: help that keeps working when the network does not">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3D1"/>
      <stop offset="0.38" stop-color="#FBD5DE"/>
      <stop offset="0.7" stop-color="#E2D6F7"/>
      <stop offset="1" stop-color="#CBE8F4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A488"/>
      <stop offset="0.5" stop-color="#E58CA8"/>
      <stop offset="1" stop-color="#9C8BDB"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="round"><rect width="1200" height="340" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
