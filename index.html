<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14161a" />
    <title>Lifeline: infrastructure test</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <main>
      <h1>Lifeline</h1>
      <p class="note">
        Infrastructure test page. It checks the hybrid AI stack and gives no
        emergency guidance. In an emergency, call 112.
      </p>

      <section aria-labelledby="status-title">
        <h2 id="status-title">Status</h2>
        <dl>
          <dt>Network</dt>
          <dd id="status-network">…</dd>
          <dt>Offline app shell</dt>
          <dd id="status-sw">…</dd>
          <dt>Firebase</dt>
          <dd id="status-firebase">…</dd>
          <dt>On-device model</dt>
          <dd id="status-device">…</dd>
        </dl>
        <button id="download" type="button" hidden>Download on-device model</button>
        <progress id="download-progress" max="1" value="0" hidden></progress>
      </section>

      <section aria-labelledby="test-title">
        <h2 id="test-title">Prompt test</h2>
        <form id="prompt-form">
          <label for="mode">Inference mode</label>
          <select id="mode">
            <option value="prefer_on_device">PREFER_ON_DEVICE</option>
            <option value="prefer_in_cloud">PREFER_IN_CLOUD</option>
            <option value="only_on_device">ONLY_ON_DEVICE</option>
            <option value="only_in_cloud">ONLY_IN_CLOUD</option>
          </select>

          <label for="prompt">Prompt</label>
          <textarea id="prompt" rows="3">Say hello in one short sentence.</textarea>

          <button id="send" type="submit">Send</button>
        </form>

        <output id="result" hidden>
          <p><span id="result-source" class="badge"></span> <span id="result-time"></span></p>
          <p id="result-text"></p>
        </output>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
