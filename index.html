<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14161a" />
    <title>Lifeline: altyapı testi</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <main>
      <header>
        <h1>Lifeline</h1>
        <button id="language" class="secondary" type="button">English</button>
      </header>
      <p class="note" data-i18n="note">
        Altyapı test sayfası. Hibrit yapay zekâ yığınını sınar, acil durum bilgisi
        vermez. Acil durumda 112'yi arayın.
      </p>

      <section aria-labelledby="status-title">
        <h2 id="status-title" data-i18n="statusTitle">Durum</h2>
        <dl>
          <dt data-i18n="network">Ağ</dt>
          <dd id="status-network">…</dd>
          <dt data-i18n="offlineShell">Çevrimdışı açılış</dt>
          <dd id="status-sw">…</dd>
          <dt>Firebase</dt>
          <dd id="status-firebase">…</dd>
          <dt data-i18n="deviceModel">Cihazdaki model</dt>
          <dd id="status-device">…</dd>
        </dl>
        <button id="download" type="button" data-i18n="downloadModel" hidden>
          Cihazdaki modeli indir
        </button>
        <progress id="download-progress" max="1" value="0" hidden></progress>
      </section>

      <section aria-labelledby="test-title">
        <h2 id="test-title" data-i18n="testTitle">Model testi</h2>
        <form id="prompt-form">
          <label for="mode" data-i18n="inferenceMode">Çıkarım modu</label>
          <select id="mode">
            <option value="prefer_on_device" data-i18n="modePreferDevice">Önce cihaz</option>
            <option value="prefer_in_cloud" data-i18n="modePreferCloud">Önce bulut</option>
            <option value="only_on_device" data-i18n="modeOnlyDevice">Yalnızca cihaz</option>
            <option value="only_in_cloud" data-i18n="modeOnlyCloud">Yalnızca bulut</option>
          </select>

          <label for="prompt" data-i18n="message">Mesaj</label>
          <textarea id="prompt" rows="3">Bana tek cümleyle merhaba de.</textarea>

          <button id="send" type="submit" data-i18n="send">Gönder</button>
        </form>

        <output id="result" hidden>
          <p><span id="result-source" class="badge"></span> <span id="result-time"></span></p>
          <p id="result-text"></p>
        </output>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
