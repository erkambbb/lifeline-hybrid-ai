<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14161a" />
    <title>Lifeline: altyapı testi</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <main>
      <h1>Lifeline</h1>
      <p class="note">
        Altyapı test sayfası. Hibrit yapay zekâ yığınını sınar, acil durum bilgisi
        vermez. Acil durumda 112'yi arayın.
      </p>

      <section aria-labelledby="status-title">
        <h2 id="status-title">Durum</h2>
        <dl>
          <dt>Ağ</dt>
          <dd id="status-network">…</dd>
          <dt>Çevrimdışı açılış</dt>
          <dd id="status-sw">…</dd>
          <dt>Firebase</dt>
          <dd id="status-firebase">…</dd>
          <dt>Cihazdaki model</dt>
          <dd id="status-device">…</dd>
        </dl>
        <button id="download" type="button" hidden>Cihazdaki modeli indir</button>
        <progress id="download-progress" max="1" value="0" hidden></progress>
      </section>

      <section aria-labelledby="test-title">
        <h2 id="test-title">Model testi</h2>
        <form id="prompt-form">
          <label for="mode">Çıkarım modu</label>
          <select id="mode">
            <option value="prefer_on_device">Önce cihaz</option>
            <option value="prefer_in_cloud">Önce bulut</option>
            <option value="only_on_device">Yalnızca cihaz</option>
            <option value="only_in_cloud">Yalnızca bulut</option>
          </select>

          <label for="prompt">Mesaj</label>
          <textarea id="prompt" rows="3">Bana tek cümleyle merhaba de.</textarea>

          <button id="send" type="submit">Gönder</button>
        </form>

        <output id="result" hidden>
          <p><span id="result-source" class="badge"></span> <span id="result-time"></span></p>
          <p id="result-text"></p>
        </output>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
